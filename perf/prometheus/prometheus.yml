# 서버 쪽 대상은 모두 tunnel.sh가 연 SSH 터널이에요 (서버에선 127.0.0.1에만 열려 있어요).
# 로컬 api(노트북 8080)도 같은 job "api"로 긁되 target="local"을 붙여요. lib/tools.py가 결과 폴더의 대상에 맞는 쪽만 골라요
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:18080"], labels: { target: server } }]

  # 로컬 실행(perf/run.sh, BASE_URL=http://localhost:8080). 꺼져 있으면 이 대상만 down으로 보여요
  - job_name: api-local
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8080"], labels: { target: local } }]
    relabel_configs:
      - { target_label: job, replacement: api }

  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:18081"], labels: { target: server } }]

  # 서버 CPU·메모리·네트워크 (steal이 오르면 CPU 크레딧이 바닥난 거예요)
  - job_name: node
    static_configs: [{ targets: ["host.docker.internal:19100"] }]

  # 컨테이너별 CPU·메모리
  - job_name: cadvisor
    static_configs: [{ targets: ["host.docker.internal:19101"] }]
