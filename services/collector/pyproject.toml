[project]
name = "mujuthaek-collector"
version = "0.1.0"
description = "지방 공사 주거 공고 수집 워커"
requires-python = ">=3.12"
dependencies = [
  "mujuthaek-platform",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "pyhwp>=0.1b15",
  "six>=1.16",
  "apscheduler>=3.10,<4",
  "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.23"]

[tool.uv.sources]
mujuthaek-platform = { path = "../../libs/python-platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mujuthaek_collector"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip 길이가 다른 건 의도된 경우가 많아요 (머리글보다 짧은 행 등)

[tool.ruff.lint.isort]
known-first-party = ["mujuthaek_platform", "mujuthaek_collector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
