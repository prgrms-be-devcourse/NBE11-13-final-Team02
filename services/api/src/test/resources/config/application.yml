# 테스트 전용: 터미널에 .env를 불러온 상태(FRONTEND_URL, 소셜 키 …)여도 테스트 결과가 같게 값을 고정해요.
# config/application.yml은 기본 application.yml보다 우선이라, 여기 적은 값만 덮어써요.
app:
  frontend-url: http://localhost:3000
  jwt:
    secret: test-only-jwt-secret-0123456789-abcdefghij
spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-secret
          naver:
            client-id: test-naver-client
            client-secret: test-naver-secret
          google:
            client-id: test-google-client
            client-secret: test-google-secret
