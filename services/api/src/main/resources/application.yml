spring:
  application:
    name: api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true                     # 가상 스레드 (ADR-020)
  datasource:
    url: ${API_DB_URL:jdbc:postgresql://localhost:5432/api}
    username: ${API_DB_USER:api_app}
    password: ${API_DB_PASSWORD:api-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                # 테이블은 Flyway가 만들고 JPA는 확인만
  flyway:
    schemas: common,notice,benefit,eligibility,area,account,notification,traffic,chat
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:mujuthaek}
    password: ${RABBITMQ_PASSWORD:mq-pass}
    listener:
      simple:
        default-requeue-rejected: false # 실패 메시지는 무한 재시도 대신 실패 큐로
        # 한 번에 미리 받아 두는 메시지 수 (기본 250). 많이 받아 두면 앞 메시지가 오래 걸릴 때 뒤 메시지가 ack 없이 쌓여
        # RabbitMQ consumer_timeout(30분)에 채널이 닫혀요. 오래 걸리는 일(area 적재)은 대기열로 떼었어요
        prefetch: 10
        retry:                          # 연결 오류 같은 예외는 두 번 더 해 보고 실패 큐로 (2초 → 4초)
          enabled: true
          max-retries: 2                # Boot 4부터 max-attempts는 읽지 않아요 (처음 1번 + 다시 2번)
          initial-interval: 2s
          multiplier: 2
    publisher-confirm-type: correlated  # 아웃박스: 브로커가 받았다고 답해야 보낸 것으로 쳐요
    publisher-returns: true             # 받을 큐가 없으면 버리지 말고 되돌려 받아요
    template:
      mandatory: true
  security:
    oauth2:
      client:
        # 콜백 주소(redirect-uri): OAUTH_REDIRECT_BASE_URL(예: https://mujuthaek-fe.vercel.app)이 있으면 그 주소로 고정, 없으면 요청 주소({baseUrl}, 로컬).
        # 운영은 Vercel rewrites → nginx → api를 거쳐 요청 주소가 http·서버 IP가 될 수 있어서 고정해요 (Google은 http 콜백을 거절해요)
        registration:
          kakao:                        # 카카오 로그인 (developers.kakao.com 앱의 REST API 키·Client Secret)
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id-not-set}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}"
            scope: profile_nickname     # 닉네임만 받아요 (이메일·나이 등은 받지 않음)
            client-name: Kakao
          naver:                        # 네이버 로그인 (developers.naver.com 애플리케이션의 Client ID·Secret)
            client-id: ${NAVER_CLIENT_ID:naver-client-id-not-set}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}"
            client-name: Naver          # 받는 항목은 scope가 아니라 콘솔의 '제공 정보'로 정해요 (별명만)
          google:                       # 구글 로그인 (Google Cloud Console OAuth 클라이언트 ID·보안 비밀번호)
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile              # 이름만. openid를 넣으면 OIDC 처리기로 가서 SocialOAuth2UserService를 거치지 않아요
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}"
            client-name: Google         # 주소(provider)는 스프링이 이미 알고 있어요
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response  # 회원 정보가 response 안에 들어 있어요

app:
  outbox:
    relay-interval-ms: 1000             # 아웃박스 → RabbitMQ 발송 주기
  frontend-url: ${FRONTEND_URL:http://localhost:3000}  # 로그인 뒤 돌아갈 화면, CORS 허용 주소
  cors-origins: ${CORS_ORIGINS:}        # 더 허용할 프론트 주소, 쉼표로 여러 개 (예: http://localhost:3200,https://preview.mujuthaek.kr)
  admin:
    # 처음 최상위 관리자로 정할 회원 ID. 가입한 뒤 넣고 서버를 다시 띄워요. 최상위가 이미 있으면 무시 (SuperAdminBootstrap)
    bootstrap-user-id: ${ADMIN_BOOTSTRAP_USER_ID:}
  jwt:
    # HS256 서명 키 (32바이트 이상). 운영은 반드시 JWT_SECRET으로 바꿔요 (README)
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
    issuer: mujuthaek-api
    access-token-ttl: 30m               # 요청마다 Authorization: Bearer 로 보내는 토큰
    refresh-token-ttl: 14d              # 로그인 유지 기간. HttpOnly 쿠키, DB에는 해시만
    cookie-secure: false                # 로컬은 http라 false. 운영은 true (application-prod.yml)
  push:                                 # 웹 푸시 (contracts/schemas/web-push.draft.md). 개인키는 알림 서버에만 있어요
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}  # 비어 있으면 구독을 받지 않아요 (공개키 API 503). 만들기: npx web-push generate-vapid-keys

mujuthaek:
  judging:                              # 판정 캐시 (공고: 판정 모델 한 개 약 4.4KB, 혜택: 지원 내용·읽어 둔 조건). 적중률 mujuthaek_judging_cache_total
    cache-size: ${JUDGING_CACHE_SIZE:20000}                   # 공고 (ID·버전)
    benefit-cache-size: ${JUDGING_BENEFIT_CACHE_SIZE:20000}   # 혜택 (ID·수정 시각)
    prewarm: ${JUDGING_PREWARM:true}    # 뜰 때 열린 공고를 뒤에서 미리 채워요
  s3:                                   # collector와 같은 환경 변수. S3_ENDPOINT를 빈 값으로 주면 AWS S3 (EC2 역할)
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:mujuthaek-raw}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${MINIO_ROOT_USER:minio}        # endpoint가 있을 때만 써요 (로컬 MinIO)
    secret-key: ${MINIO_ROOT_PASSWORD:minio-pass}
  notice:
    extraction-review:                  # 추출 서비스 검수 API. 관리자 검수 화면이 이 서버를 거쳐 불러요
      base-url: ${EXTRACTION_REVIEW_URL:http://localhost:8092}
      token: ${EXTRACTION_REVIEW_TOKEN:}  # 추출 서비스와 같은 값. 비면 보내지 않아요(로컬은 같은 컴퓨터 요청만 받음)
      timeout: 5s
    collector-admin:                    # 수집기 관리자 API. 관리자 수집 현황 화면이 이 서버를 거쳐 불러요
      base-url: ${COLLECTOR_ADMIN_URL:http://localhost:8093}
      token: ${COLLECTOR_ADMIN_TOKEN:}  # 수집기와 같은 값. 비면 보내지 않아요
      timeout: 5s
  notification:
    server:                             # 알림 서버 내부 API. 관리자 알림 화면의 발송 결과를 이 서버를 거쳐 받아요
      base-url: ${NOTIFICATION_SERVER_URL:http://localhost:8081}
      token: ${NOTIFICATION_INTERNAL_TOKEN:}  # 알림 서버와 같은 값. 비면 보내지 않아요(로컬은 같은 컴퓨터 요청만 받음)
      timeout: 5s
  traffic:                              # 관리자 트래픽 화면 (GA 숫자 + api 서버 요청 기록)
    ip-salt: ${TRAFFIC_IP_SALT:local-dev-salt}  # IP 해시에 섞는 비밀 값. 운영은 꼭 따로 넣어요
    raw-ip-days: 14                     # 원본 IP 보관 일수(보안 대응용). 지나면 지워요
    keep-days: 90                       # 요청 기록 보관 일수
    ingest-token: ${TRAFFIC_INGEST_TOKEN:}  # 프론트 서버가 화면 요청을 넘길 때 쓰는 비밀 값. 비면 화면 요청은 안 받아요
    ga:
      property-id: ${GA_PROPERTY_ID:}   # GA4 속성 ID(숫자). 비면 GA 숫자 없이 서버 숫자만
      credentials-file: ${GA_CREDENTIALS_FILE:}  # 서비스 계정 키(JSON) 경로. 저장소 밖에 둬요
      cache-ttl: 1h                     # 같은 기간 보고서를 다시 묻지 않는 시간(GA 호출 한도)
      timeout: 10s
  ops-alert:                            # 운영 슬랙 알림 (처리 못 한 오류, 실패 큐, area 적재 실패·멈춤, 다른 서비스 연결 실패)
    webhook-url: ${SLACK_WEBHOOK_URL:${EXTRACTION_SLACK_WEBHOOK_URL:}}  # 추출 서비스 비용 알림과 같은 웹훅. 비면 보내지 않아요
    environment: ${MUJUTHAEK_ENV:local} # 메시지 머리 [prod api]
    quiet: 10m                          # 같은 종류는 이 시간 안에 한 번만 (그동안 횟수는 다음 알림에)
    ignore-codes: ${OPS_ALERT_IGNORE_CODES:}  # 이 환경에서 늘 나는 게 정상이라 알리지 않을 오류 코드 (쉼표로)
  area:
    load:
      statement-timeout: 90m            # 적재 SQL 하나가 이보다 오래 걸리면 끊고 실패로 (멈춘 채 기다리지 않게)
    score-version: "2026.1"             # area.score_rules의 생활권 점수 규칙 버전. 바꾸면 전체 다시 계산
    juso-search:                        # 도로명주소 검색 API. 키가 비면 부르지 않아요 (주소 사전으로만 찾음)
      base-url: https://business.juso.go.kr/addrlink/addrLinkApi.do
      api-key: ${JUSO_SEARCH_API_KEY:}
      per-second: 5
      per-day: 10000
      retries: 2
      timeout: 5s
    juso-coord:                         # 도로명주소 좌표제공 API (사전에 없는 새 건물). 키가 비면 부르지 않아요 (법정동 대표점으로)
      base-url: https://business.juso.go.kr/addrlink/addrCoordApi.do
      api-key: ${JUSO_COORD_API_KEY:}
      per-second: 5
      per-day: 10000
      retries: 2
      timeout: 5s

server:
  compression:                          # JSON 응답을 gzip으로 (관리자 목록·공고 상세가 수백 KB, 2026-10-30 부하 시험)
    enabled: true
    min-response-size: 1KB              # 작은 응답은 그대로. 이야기 실시간(text/event-stream)은 기본 대상이 아니라 압축하지 않아요
    mime-types: application/json,application/problem+json,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true      # 서버 쪽 p95·p99를 Prometheus에서 계산해요
