spring:
  application:
    name: api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true                     # 가상 스레드 (ADR-020)
  datasource:
    url: ${API_DB_URL:jdbc:postgresql://localhost:5432/api}
    username: ${API_DB_USER:api_app}
    password: ${API_DB_PASSWORD:api-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                # 테이블은 Flyway가 만들고 JPA는 확인만
  flyway:
    schemas: common,notice,benefit,eligibility,area,account,notification
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:mujuthaek}
    password: ${RABBITMQ_PASSWORD:mq-pass}
    listener:
      simple:
        default-requeue-rejected: false # 실패 메시지는 무한 재시도 대신 실패 큐로
        retry:                          # 연결 오류 같은 예외는 몇 번 더 해 보고 실패 큐로 (2초 → 4초)
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

mujuthaek:
  s3:                                   # collector와 같은 환경 변수. S3_ENDPOINT를 빈 값으로 주면 AWS S3 (EC2 역할)
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:mujuthaek-raw}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${MINIO_ROOT_USER:minio}        # endpoint가 있을 때만 써요 (로컬 MinIO)
    secret-key: ${MINIO_ROOT_PASSWORD:minio-pass}
  area:
    score-version: "2026.1"             # area.score_rules의 생활권 점수 규칙 버전. 바꾸면 전체 다시 계산

management:
  endpoints:
    web:
      exposure:
        include: health,info
