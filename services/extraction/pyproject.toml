[project]
name = "extraction"
version = "0.1.0"
requires-python = ">=3.12"
# 결합기가 contracts/ 스키마로 AI 출력과 후보를 검사합니다. 형식 검사 의존성이 없으면 date-time·uri 검사가 조용히 빠집니다.
dependencies = [
  "mujuthaek-platform",  # 팀 공통: 이벤트 봉투·아웃박스·RabbitMQ·DB·로그 (libs/python-platform)
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
  "rfc3986-validator>=0.1.1",
  "boto3>=1.34",  # textKey·첨부 원본을 S3(로컬 MinIO)에서 읽기
  "pdfplumber>=0.11",  # PDF → 쪽·표 구조 (collector와 같은 도구, MIT)
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mujuthaek_extraction"]

[tool.uv.sources]
mujuthaek-platform = { path = "../../libs/python-platform", editable = true }

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # 일회성 오프라인 사례 스크립트: 보고서 문장이 대부분입니다

[tool.ruff.lint.isort]
known-first-party = ["mujuthaek_extraction", "mujuthaek_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
