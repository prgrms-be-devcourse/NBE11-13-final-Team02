name: Deploy dev

# dev 브랜치에 올라온 변경 중 바뀐 서비스만 개발 서버(dev EC2)에 배포해요.
# 이미지: ghcr.io/<저장소>/<서비스>:dev-<커밋 7자리>. 서버 작업은 infra/deploy/deploy.sh가 해요 (README 참고)
on:
  push:
    branches: [dev]
  workflow_dispatch: # 손으로 실행하면 세 서비스를 모두 빌드·배포해요 (개발 서버 첫 배포)

concurrency:
  group: deploy-dev
  cancel-in-progress: false # 배포 중간에 끊지 않고 다음 배포가 기다려요

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: 바뀐 서비스 찾기
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
      deploy-files: ${{ steps.filter.outputs.deploy }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - services/api/**
              - services/extraction/data/legal-dong-codes/**
              - contracts/**
            notification:
              - services/notification/**
            extraction:
              - services/extraction/**
              - libs/**
              - contracts/**
            deploy:
              - infra/deploy/**
      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            services='["api","notification","extraction"]'
          else
            services="$(echo "$CHANGED" | jq -c '[.[] | select(. == "api" or . == "notification" or . == "extraction")]')"
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: 이미지 (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.changes.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: 개발 서버 배포
    needs: [changes, build]
    # 이미지가 없고 설정만 바뀐 경우에도 설정은 서버로 보내요
    if: >-
      always() && needs.changes.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
      && (needs.changes.outputs.services != '[]' || needs.changes.outputs.deploy-files == 'true')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5
      - name: 배포 설정 보내기 (infra/deploy → /opt/mujuthaek)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/deploy/*
          target: /opt/mujuthaek
          strip_components: 2
      - name: .env 쓰기 · 배포
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICES: ${{ join(fromJSON(needs.changes.outputs.services), ' ') }}
          VERSION: ${{ needs.changes.outputs.version }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_FILE,GHCR_USER,GHCR_TOKEN,SERVICES,VERSION
          script: |
            set -eu
            cd /opt/mujuthaek
            umask 077
            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env
            chmod +x deploy.sh shovel.sh
            if [ -z "$SERVICES" ]; then
              echo "설정만 바뀌어 보냈어요"
              exit 0
            fi
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null' EXIT
            for service in $SERVICES; do
              ./deploy.sh dev "$service" "$VERSION"
            done
