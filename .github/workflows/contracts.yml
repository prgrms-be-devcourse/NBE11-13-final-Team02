name: Contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "services/extraction/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/**"
      - "services/extraction/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  notice-contracts:
    name: notice contracts (schema · semantic regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements-dev.txt
      - run: python -m pip install -r contracts/requirements-dev.txt
      - run: python contracts/tools/validate_contracts.py
      - run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
