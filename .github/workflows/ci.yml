name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # PR에 커버리지 댓글

jobs:
  api:
    name: api (spotless · test · 모듈 경계)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers는 러너에 있는 Docker를 그대로 써요. check에 커버리지 기준(service·rule 80%)도 들어 있어요
      - run: ./gradlew check --console=plain
      - name: PR에 커버리지 표시
        if: always() && github.event_name == 'pull_request' && hashFiles('services/api/build/reports/jacoco/test/jacocoTestReport.xml') != ''
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: services/api/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 커버리지 (service · eligibility/rule)
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          update-comment: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: services/api/build/reports/

  notification:
    name: notification (spotless · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers(PostgreSQL·RabbitMQ)는 러너에 있는 Docker를 그대로 써요
      - run: ./gradlew check --console=plain
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-reports
          path: services/notification/build/reports/

  python:
    # 잡 이름은 룰셋의 필수 체크 이름이라 바꾸지 않아요 (린트 + 테스트를 같이 돌려요)
    name: python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # ruff 버전은 uv.lock과 같게 고정해요 (새 버전이 나와도 CI 결과가 갑자기 바뀌지 않게)
      - run: uvx ruff@0.17.0 check services/collector services/extraction libs/python-platform
      - run: uvx ruff@0.17.0 format --check services/collector services/extraction libs/python-platform
      - name: python-platform 테스트
        working-directory: libs/python-platform
        run: uv run --frozen pytest -q
      - name: collector 테스트
        working-directory: services/collector
        run: uv run --frozen pytest -q  # 실제 DB 테스트(test_storage_postgres)는 COLLECTOR_TEST_DB_URL이 없어서 건너뛰어요

  notify:
    name: 슬랙 알림 (dev·main 실패)
    needs: [api, notification, python]
    # PR이 아니라 dev·main에 올라간 뒤 깨졌을 때만 알려요
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development # ENV_FILE 안의 SLACK_WEBHOOK_URL을 쓰려고
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          RESULTS: "api ${{ needs.api.result }} · notification ${{ needs.notification.result }} · python ${{ needs.python.result }}"
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          text="$(printf '[CI] :x: %s 브랜치 검사 실패\n%s\n%s · %s\n%s' \
            "$BRANCH" "$RESULTS" "${COMMIT%%$'\n'*}" "$ACTOR" "$RUN_URL")"
          .github/scripts/slack-notify.sh "$text"
