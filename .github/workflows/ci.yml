name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (spotless · test · 모듈 경계)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers는 러너에 있는 Docker를 그대로 써요
      - run: ./gradlew check --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: services/api/build/reports/

  python:
    name: python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check services/collector services/extraction libs/python-platform
      - run: uvx ruff format --check services/collector services/extraction libs/python-platform
