name: Main Guard

# main으로 가는 PR은 dev에서만 받아요. 이 체크는 main 룰셋의 필수 체크예요.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  source-branch:
    name: main 머지는 dev에서만
    runs-on: ubuntu-latest
    steps:
      - name: 출발 브랜치 확인
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::main에는 dev 브랜치만 머지할 수 있어요 (지금: $HEAD_REF). PR 대상을 dev로 바꿔주세요."
            exit 1
          fi
          echo "dev → main 확인"
