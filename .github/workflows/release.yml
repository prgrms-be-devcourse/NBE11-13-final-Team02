name: Release

# 운영 배포. 서비스마다 태그로 올려요: api-v1.2.0, notification-v1.2.0, collector-v1.2.0, extraction-v1.2.0
#   태그 → 테스트 → 이미지(ghcr.io/<저장소>/<서비스>:v1.2.0) → 운영 서버 배포(infra/deploy/deploy.sh) → 릴리즈 노트
# 손으로 실행(workflow_dispatch):
#   롤백   이미 있는 버전으로 되돌리기 (build 끔)
#   첫 배포 서비스 all + build 켬: 고른 브랜치로 네 서비스를 테스트·빌드해서 같은 버전으로 한 번에 배포
on:
  push:
    tags: ["api-v*", "notification-v*", "collector-v*", "extraction-v*"]
  workflow_dispatch:
    inputs:
      service:
        description: 서비스
        required: true
        type: choice
        options: [api, notification, collector, extraction, all]
      version:
        description: "버전 (예: v1.2.0)"
        required: true
        type: string
      build:
        description: 이 브랜치로 테스트·빌드해서 그 버전 이미지를 만들기 (첫 배포). 끄면 이미 있는 이미지로 배포(롤백)
        type: boolean
        default: false

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write # 릴리즈 노트
  packages: write

jobs:
  meta:
    name: 서비스·버전
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.meta.outputs.services }}
      target: ${{ steps.meta.outputs.target }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          if [ "$EVENT" = push ]; then
            target="${TAG%%-v*}"            # api-v1.2.0 → api
            version="v${TAG#*-v}"           # api-v1.2.0 → v1.2.0
            build=true
          else
            target="$INPUT_SERVICE"
            version="$INPUT_VERSION"
            build="$INPUT_BUILD"
          fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9A-Za-z.+_-]+$'; then
            echo "버전은 v로 시작해요 (예: v1.2.0): $version" >&2
            exit 1
          fi
          if [ "$target" = all ]; then
            services='["api","notification","collector","extraction"]'
          else
            services="[\"$target\"]"
          fi
          {
            echo "target=$target"
            echo "version=$version"
            echo "build=$build"
            echo "services=$services"
          } >> "$GITHUB_OUTPUT"

  test:
    name: 테스트 (${{ matrix.service }})
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.meta.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.service == 'api' || matrix.service == 'notification'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - if: matrix.service == 'api' || matrix.service == 'notification'
        uses: gradle/actions/setup-gradle@v5
      - if: matrix.service == 'api' || matrix.service == 'notification'
        working-directory: services/${{ matrix.service }}
        run: ./gradlew check --console=plain
      - if: matrix.service == 'collector' || matrix.service == 'extraction'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - if: matrix.service == 'collector' || matrix.service == 'extraction'
        working-directory: services/${{ matrix.service }}
        run: uv run --frozen pytest -q

  build:
    name: 이미지 (${{ matrix.service }})
    needs: [meta, test]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.meta.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: 운영 서버 배포
    needs: [meta, build]
    # 롤백(build 끔)이면 빌드를 건너뛰고 바로 배포해요. 빌드를 켰는데 테스트 실패로 빌드가 건너뛰어졌으면 배포하지 않아요
    # (없는 이미지를 받다가 실패해 모든 서비스를 이전 태그로 되돌리며 다시 띄우던 문제, 2026-10-29 v0.2.0)
    if: >-
      always() && needs.meta.result == 'success'
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.meta.outputs.build == 'false'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: 배포 설정 보내기 (infra/deploy → /opt/mujuthaek)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/deploy/*
          target: /opt/mujuthaek
          strip_components: 2
      - name: .env 쓰기 · 배포
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TARGET은 ssh-action이 자기 실행 파일 경로로 덮어써서 다른 이름을 써요
          DEPLOY_SERVICE: ${{ needs.meta.outputs.target }}
          VERSION: ${{ needs.meta.outputs.version }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_FILE,GHCR_USER,GHCR_TOKEN,DEPLOY_SERVICE,VERSION
          # 서비스 여러 개를 한 번에 배포하면 기본 10분을 넘어요 (이미지 받기·헬스체크 최대 3분씩)
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/mujuthaek
            umask 077
            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env
            chmod +x deploy.sh shovel.sh copy-prod-to-dev.sh
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null' EXIT
            ./deploy.sh prod "$DEPLOY_SERVICE" "$VERSION"

  notes:
    name: 태그 · 릴리즈 노트
    needs: [meta, deploy]
    # 새 버전을 배포했을 때만 (태그로 올렸거나, 손으로 실행했는데 빌드를 켰을 때). 되돌리기(빌드 끔)는 남기지 않아요
    if: needs.deploy.result == 'success' && needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF_TAG: ${{ github.ref_name }}
          TARGET: ${{ needs.meta.outputs.target }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 태그 이름: 태그로 올렸으면 그 태그. 손으로 실행했으면 서비스 하나는 「api-v0.2.1」, 전체(all)는 「v0.2.1」
          # (이 워크플로의 GITHUB_TOKEN이 만든 태그는 워크플로를 다시 부르지 않아요. 태그로 또 배포되지 않아요)
          if [ "$EVENT" = push ]; then
            tag="$REF_TAG"
          elif [ "$TARGET" = all ]; then
            tag="$VERSION"
          else
            tag="$TARGET-$VERSION"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "릴리즈 ${tag}가 이미 있어요 (다시 실행). 새로 만들지 않아요"
            exit 0
          fi
          notes="$(printf '배포: 운영 · 서비스 %s · 버전 %s\n실행: %s · %s' "$TARGET" "$VERSION" "$ACTOR" "$RUN_URL")"
          # 손으로 실행했으면 태그가 아직 없어서 배포한 커밋(SHA)에 새로 만들어요. 바뀐 PR 목록은 이전 릴리즈부터 자동으로 붙어요
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "$tag" --notes "$notes" --generate-notes

  notify:
    name: 슬랙 알림
    needs: [meta, test, build, deploy]
    if: always() && needs.meta.result != 'skipped'
    runs-on: ubuntu-latest
    environment: production # ENV_FILE 안의 SLACK_WEBHOOK_URL을 쓰려고
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          META: ${{ needs.meta.result }}
          TEST: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          TARGET: ${{ needs.meta.outputs.target }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          kind="릴리즈"
          [ "$BUILD" = false ] && kind="되돌리기(이미 있는 이미지)"
          [ "$BUILD" = true ] && kind="릴리즈 (태그 · 릴리즈 노트를 남겨요)"
          if [ "$META" = failure ]; then
            result=":x: 서비스·버전을 읽지 못했어요"
          elif [ "$TEST" = failure ] || [ "$BUILD_RESULT" = failure ] || { [ "$BUILD" = true ] && [ "$BUILD_RESULT" != success ]; }; then
            result=":x: 테스트·빌드 실패 (배포하지 않았어요, 운영은 그대로)"
          elif [ "$DEPLOY" = success ]; then
            result=":white_check_mark: 운영 배포 완료"
          elif [ "$DEPLOY" = failure ]; then
            result=":rotating_light: 운영 배포 실패 (헬스체크에 실패한 서비스는 deploy.sh가 이전 버전으로 되돌렸어요)"
          else
            result=":white_circle: 취소·건너뜀 (deploy: ${DEPLOY:-없음})"
          fi
          text="$(printf '[prod] %s\n%s · 서비스: %s · 버전: %s\n%s · %s' \
            "$result" "$kind" "${TARGET:-?}" "${VERSION:-?}" "$ACTOR" "$RUN_URL")"
          .github/scripts/slack-notify.sh "$text"
