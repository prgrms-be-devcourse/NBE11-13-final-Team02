# 로컬 개발용 인프라. 저장소 루트에서 make infra (PostgreSQL·RabbitMQ·MinIO), make help로 명령 보기
name: mujuthaek

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD}
      EXTRACTION_DB_PASSWORD: ${EXTRACTION_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification-pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # 관리 화면 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO 공식 이미지(minio/minio)는 더 이상 받을 수 없어서, 같은 MinIO를 담은 bitnamilegacy 이미지를 버전 고정으로 써요.
  # 버킷은 MINIO_DEFAULT_BUCKETS로 처음 뜰 때 만들어져요 (예전 minio-init 대신).
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    ports:
      - "127.0.0.1:9000:9000"     # S3 API. 이 버전부터 웹 콘솔이 없어서 파일 확인은 컨테이너 안 mc로 해요
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # collector 데이터베이스 테이블 (services/collector/migrations). make migrate-collector
  # COLLECTOR_DB로 대상 DB를 바꿀 수 있어요 (make migrate-collector-test는 collector_test)
  migrate-collector:
    image: flyway/flyway:11.14
    profiles: [apps]
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${COLLECTOR_DB:-collector} -user=collector_app -password=${COLLECTOR_DB_PASSWORD}
      -locations=filesystem:/flyway/sql -connectRetries=10 migrate
    volumes:
      - ../services/collector/migrations:/flyway/sql:ro

  # extraction 데이터베이스 테이블 (services/extraction/migrations). make migrate-extraction
  # 작업 기록·검수 대기열·아웃박스·처리권·비용 장부 등. extraction worker를 띄우기 전에 한 번 적용해요
  migrate-extraction:
    image: flyway/flyway:11.14
    profiles: [apps]
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/extraction -user=extraction_app -password=${EXTRACTION_DB_PASSWORD}
      -locations=filesystem:/flyway/sql -connectRetries=10 migrate
    volumes:
      - ../services/extraction/migrations:/flyway/sql:ro

  # 수집 워커 (make up). 평소엔 make infra 후 services/collector에서 uv run으로 직접 실행해요.
  # 컨테이너 안에서는 localhost가 아니라 서비스 이름으로 접속해요.
  collector:
    build: { context: .., dockerfile: services/collector/Dockerfile }
    profiles: [apps]
    depends_on:
      migrate-collector: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      SERVICE_NAME: collector
      DB_URL: postgresql://collector_app:${COLLECTOR_DB_PASSWORD}@postgres:5432/collector
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LH_API_KEY: ${LH_API_KEY:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}   # 정책 API 인증키 (비우면 정책 출처는 건너뜀)
      YOUTHCENTER_API_KEY: ${YOUTHCENTER_API_KEY:-}
      BIZINFO_API_KEY: ${BIZINFO_API_KEY:-}
      # 처음 수집 개수 제한 (services/collector/README.md)
      COLLECTOR_INTAKE_HOUSING_LH: ${COLLECTOR_INTAKE_HOUSING_LH:-10}
      COLLECTOR_INTAKE_HOUSING_OTHER: ${COLLECTOR_INTAKE_HOUSING_OTHER:-10}
      COLLECTOR_INTAKE_SPACE: ${COLLECTOR_INTAKE_SPACE:-10}
      COLLECTOR_INTAKE_POLICY: ${COLLECTOR_INTAKE_POLICY:-500}
    ports: ["127.0.0.1:8091:8091"]   # 상태 확인 http://localhost:8091/health

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
