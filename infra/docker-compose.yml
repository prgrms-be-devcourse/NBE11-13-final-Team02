# 로컬 개발용 인프라. 저장소 루트에서 make infra (PostgreSQL·RabbitMQ·MinIO), make help로 명령 보기
name: mujuthaek

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD}
      EXTRACTION_DB_PASSWORD: ${EXTRACTION_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # 관리 화면 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO 공식 이미지(minio/minio)는 더 이상 받을 수 없어서, 같은 MinIO를 담은 bitnamilegacy 이미지를 버전 고정으로 써요.
  # 버킷은 MINIO_DEFAULT_BUCKETS로 처음 뜰 때 만들어져요 (예전 minio-init 대신).
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    ports:
      - "127.0.0.1:9000:9000"     # S3 API. 이 버전부터 웹 콘솔이 없어서 파일 확인은 컨테이너 안 mc로 해요
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # collector 데이터베이스 테이블 (services/collector/migrations). make migrate-collector
  migrate-collector:
    image: flyway/flyway:11.14
    profiles: [apps]
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/collector -user=collector_app -password=${COLLECTOR_DB_PASSWORD}
      -locations=filesystem:/flyway/sql -connectRetries=10 migrate
    volumes:
      - ../services/collector/migrations:/flyway/sql:ro

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
