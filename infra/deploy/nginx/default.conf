# api 앞 프록시 (compose의 nginx). Vercel rewrites가 /api/**·/oauth2/**·/login/oauth2/**를 http://<탄력적 IP>:80으로 넘겨요.
# 모든 경로를 api로 넘기고, actuator는 /actuator/health만 열어요.
# Vercel이 보낸 X-Forwarded-Host·Proto·For는 덮어쓰지 않고 그대로, 없을 때만 Host·For는 이 연결 값($host·$remote_addr), Proto는 https로 넘겨요.
# api는 server.forward-headers-strategy=framework라 이 값으로 https://<Vercel 주소> 기준 OAuth redirect-uri·주소를 만들어요.
# 이 서버로 들어오는 길은 Vercel(https)뿐이라, X-Forwarded-Proto가 없으면 https로 넘겨요
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    # 채팅 SSE가 바로 흘러가게 버퍼를 끄고, 오래 열린 연결을 끊지 않아요
    proxy_buffering off;
    proxy_read_timeout 1h;

    location = /actuator/health {
        proxy_pass http://api:8080;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://api:8080;
    }
}
